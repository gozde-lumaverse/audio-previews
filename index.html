<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LUMA İçerikleri</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light}*{box-sizing:border-box}html,body{margin:0;padding:0;background:#FCFBF5;color:#41409A;font-family:"Quicksand",sans-serif}main{padding:8px 2px 24px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;align-items:start}.card{border:1px solid rgba(65,64,154,.18);border-radius:16px;padding:18px;min-width:0}.card h2{font-weight:700;font-size:21px;line-height:1.3;margin:0 0 16px}.list{list-style:decimal;margin:0;padding-left:25px}.list li{padding:0 0 0 2px;border-bottom:1px dashed #d8d6d4}.list li:last-child{border:0}.track{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:53px;padding:8px 0;font-size:14px;line-height:1.4}.track span{min-width:0;overflow-wrap:anywhere}.track i{font-size:12px}.play{width:34px;height:34px;flex:0 0 34px;display:grid;place-items:center;border:0;border-radius:50%;background:#41409A;color:#fff;cursor:pointer;font-size:13px;padding:0;line-height:1}.play:hover,.play[aria-pressed=true]{background:#f1592a}.play:focus-visible{outline:3px solid #E4305B;outline-offset:3px}.notice{font-size:13px;color:#E4305B;margin:10px 0 0;display:none}@media(max-width:980px){.grid{grid-template-columns:1fr;gap:16px}.card{padding:16px}}
</style>
</head>
<body>
<main><div class="grid" id="library"></div><p id="notice" class="notice" role="alert">Ses dosyası açılamadı. Lütfen daha sonra tekrar deneyin.</p></main>
<script>
const base='https://raw.githubusercontent.com/gozde-lumaverse/audio-previews/main/';
const groups=[
{title:'Şarkılar (Miniyo)',tracks:[
['Gezegenler','01Gezegenler-preview.mp3'],['Hayvan Sesleri','02Hayvan-Sesleri-preview.mp3'],['Müzikli Hareketler','03Muzikli-Hareketler-preview.mp3'],['Kırmızı Balık','04Kirmizi-Balik-preview.mp3'],['Renkler','05Renkler-preview.mp3'],['Zürafa','06Zurafa-preview.mp3'],['Haftanın Günleri','07Haftanin-Gunleri-preview.mp3'],['Brokoli','08Brokoli-preview.mp3'],['Makarna','09Makarna-preview.mp3'],['Çilek','10Cilek-preview.mp3'],['Arı Vız Vız Vız','11Ari-Viz-Viz-Viz-preview.mp3'],['Güneş','12Gunes-preview.mp3'],['Ay Şarkısı','13Ay-Sarkisi-preview.mp3'],['Duygular','14Duygular-preview.mp3'],['Diş Fırçalama','15Dis-Fircalama-preview.mp3'],['Bir Balık Olsaydım','16Bir-Balik-Olsaydim-preview.mp3'],['Dinozor Dünyası','17Dinozor-Dunyasi-preview.mp3'],['Etçil Dinozorlar','18Etcil-Dinozorlar-preview.mp3'],['Tırtıl ve Kelebek','19Tirtil-ve-Kelebek-preview.mp3'],['Deniz Yıldızları','20Denizyildizlari-preview.mp3']]},
{title:'Hikayeler (Altın Kitaplar - Sesle Kitap - Bilgi Çocuk)',tracks:[
['Uçan Goril','01Ucan-Goril-preview.mp3','Mavisel Yener'],['Köpek Okulu','02Kopek-Okulu-preview.mp3','Mavisel Yener'],['Puyo','03Puyo-Renkli-Gitarin-Sarkisi-preview.mp3','Selin Altunkaynak Vodina'],['Ödev Makinesi','04Odev-Makinesi-preview.mp3','Mavisel Yener'],['Dedektif Birce','05Dedektif-Birce-preview.mp3','Mavisel Yener'],['Orman Koruyucusu Kestane','06Orman-Koruyucusu-Kestane-preview.mp3','Hazel Woods'],['Kestane ve Rengarenk Yaramazlar','07Kestane-Rengarenk-Yaramazlar-preview.mp3','Hazel Woods'],['Kestane ve Denizin Şarkısı','08Kestane-Denizin-Sarkisi-preview.mp3','Hazel Woods'],['Kestane ve Gizli Bahçıvanlar','09Kestane-Gizli-Bahcivanlar-preview.mp3','Hazel Woods'],['Bremen Mızıkacıları','10Bremen-Mizikacilari-preview.mp3','Grimm Kardeşler'],['Kral Çıplak','11Kral-Ciplak-preview.mp3','Hans Christian Andersen'],['Kalbindeki Cesaret','12Kalbindeki-Cesaret-preview.mp3','Canev Tatar'],['Kalbindeki Cevap','13Kalbindeki-Cevap-preview.mp3','Canev Tatar'],['Pinokyo','14Pinokyo-preview.mp3','Carlo Collodi'],['Peter Pan','15Peter-Pan-preview.mp3','J. M. Barrie'],['Mış Gibi','16Mis-gibi-preview.mp3','Peter H. Reynolds'],['Benden Bir Tane Daha Olsa','17Benden-Bir-Tane-Daha-Olsa-preview.mp3','Peter H. Reynolds'],['Nokta','18Nokta-preview.mp3','Peter H. Reynolds'],['Kutup Yıldızı','19Kutup-Yildizi-preview.mp3','Peter H. Reynolds'],['Mutlu Hayalperest','20Mutlu-Hayalperest-preview.mp3','Peter H. Reynolds']]},
{title:'Ninniler (Miniyo)',tracks:[
['Brahms Ninnisi','01Brahms-Ninnisi-preview.mp3'],['Dandini Dandini Dastana','02Dandini-Dandini-Dastana-preview.mp3'],['Fış Fış Kayıkçı','03Fis-Fis-Kayikci-preview.mp3'],['Hoppidi Hoppidi Hoppala','04Hoppidi-Hoppidi-Hoppala-preview.mp3'],['İki Küçük Mor Kuş','05Iki-Kucuk-Mor-Kus-preview.mp3'],['Twinkle Twinkle Little Star','06Twinkle-Twinkle-Little-Star-preview.mp3'],['Güzel Uyu Yavrum','07Guzel-Uyu-Yavrum-preview.mp3'],['Ateş Böceği','08Ates-Bocegi-preview.mp3'],['Kelebek ve Tırtıl','09Kelebek-ve-Tirtil-preview.mp3'],['Caretta Caretta','10Caretta-Caretta-preview.mp3']]}
];
const root=document.getElementById('library');
for(const group of groups){const card=document.createElement('article');card.className='card';const heading=document.createElement('h2');heading.textContent=group.title;card.append(heading);const list=document.createElement('ol');list.className='list';for(const [name,file,author] of group.tracks){const li=document.createElement('li'),row=document.createElement('div'),label=document.createElement('span'),button=document.createElement('button');row.className='track';label.append(document.createTextNode(name));if(author){label.append(document.createTextNode(' - '));const italic=document.createElement('i');italic.textContent=author;label.append(italic)}button.type='button';button.className='play';button.textContent='▶';button.dataset.file=file;button.setAttribute('aria-label',name+' dinle');button.setAttribute('aria-pressed','false');row.append(label,button);li.append(row);list.append(li)}card.append(list);root.append(card)}
const audio=new Audio();audio.preload='none';let active=null;let playToken=0;const notice=document.getElementById('notice');
function reset(){if(active){active.textContent='▶';active.setAttribute('aria-pressed','false')}}
root.addEventListener('click',async event=>{const button=event.target.closest('button.play');if(!button)return;notice.style.display='none';if(button===active&&!audio.paused){++playToken;audio.pause();reset();return}const token=++playToken;if(button!==active){audio.pause();reset();active=button;audio.src=base+encodeURIComponent(button.dataset.file)}try{await audio.play();if(token===playToken&&active===button&&!audio.paused){button.textContent='Ⅱ';button.setAttribute('aria-pressed','true')}}catch(error){if(token===playToken){reset();notice.style.display='block'}console.error('LUMA audio error:',error)}});
audio.addEventListener('ended',()=>{reset();audio.currentTime=0});audio.addEventListener('pause',reset);audio.addEventListener('error',()=>{reset();notice.style.display='block'});
</script>
</body>
</html>
